# PrusaSlicer settings for the transparent PETG enclosure (0.4 mm nozzle, 0.2 mm layers).
# Load in PrusaSlicer: File > Import > Import Config, or on the command line with --load.
# Printer part is generic (250 x 210 bed); pick your own printer profile and keep the print/filament values.
bed_shape = 0x0,250x0,250x210,0x210
max_print_height = 210
nozzle_diameter = 0.4
gcode_flavor = marlin2
use_relative_e_distances = 1
layer_gcode = G92 E0
layer_height = 0.2
first_layer_height = 0.2
perimeters = 6
top_solid_layers = 12
bottom_solid_layers = 12
fill_density = 100%
fill_pattern = rectilinear
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
solid_infill_every_layers = 0
infill_anchor = 0
fill_angle = 45
external_perimeters_first = 0
extrusion_multiplier = 1.03
extrusion_width = 0.45
perimeter_extrusion_width = 0.45
external_perimeter_extrusion_width = 0.45
infill_extrusion_width = 0.45
solid_infill_extrusion_width = 0.45
top_infill_extrusion_width = 0.42
seam_position = rear
support_material = 0
ironing = 0
thin_walls = 0
# slow, hot and fan-light = fewer trapped bubbles and better layer fusion = clearer part
first_layer_speed = 15
external_perimeter_speed = 15
perimeter_speed = 25
small_perimeter_speed = 15
infill_speed = 30
solid_infill_speed = 30
top_solid_infill_speed = 20
bridge_speed = 20
gap_fill_speed = 20
travel_speed = 150
retract_length = 0.8
retract_speed = 35
# PETG (recycled rPETG: same settings; dry it first, 65 C / 4 h)
filament_type = PETG
filament_diameter = 1.75
filament_density = 1.27
filament_cost = 25
temperature = 250
first_layer_temperature = 245
bed_temperature = 80
first_layer_bed_temperature = 80
cooling = 1
min_fan_speed = 15
max_fan_speed = 30
bridge_fan_speed = 50
disable_fan_first_layers = 3
fan_below_layer_time = 20
slowdown_below_layer_time = 15
